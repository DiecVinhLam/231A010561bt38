<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game kiểm tra tốc độ</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f4f8;
        }

        h1 {
            color: #2563eb;
        }

        .info {
            font-size: 20px;
            margin: 15px;
        }

        #score {
            color: green;
            font-weight: bold;
        }

        #time {
            color: red;
            font-weight: bold;
        }

        #startBtn {
            padding: 12px 24px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 20px;
        }

        #startBtn:hover {
            background-color: #1d4ed8;
        }

        #arena {
            width: 600px;
            height: 400px;
            margin: auto;
            background-color: #dbeafe;
            border: 3px solid #2563eb;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        #target {
            width: 30px;
            height: 30px;
            background-color: #ef4444;
            border-radius: 50%;
            position: absolute;
            display: none;
            cursor: pointer;
        }

        #message {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            color: #1d4ed8;
        }
    </style>
</head>

<body>

    <h1>🎯 Game kiểm tra tốc độ phản xạ</h1>

    <div class="info">
        Điểm số: <span id="score">0</span>
        &nbsp; | &nbsp;
        Thời gian: <span id="time">30</span> giây
    </div>

    <button id="startBtn">Bắt đầu trò chơi</button>

    <div id="arena">
        <div id="target"></div>
    </div>

    <div id="message">Nhấn nút để bắt đầu chơi!</div>

    <script>
        const arena = document.getElementById("arena");
        const target = document.getElementById("target");
        const scoreDisplay = document.getElementById("score");
        const timeDisplay = document.getElementById("time");
        const startBtn = document.getElementById("startBtn");
        const message = document.getElementById("message");

        let score = 0;
        let timeLeft = 30;
        let gameRunning = false;
        let timer;
        let moveTimer;

        function moveTarget() {
            const maxLeft = arena.clientWidth - target.offsetWidth;
            const maxTop = arena.clientHeight - target.offsetHeight;

            const left = Math.random() * maxLeft;
            const top = Math.random() * maxTop;

            target.style.left = left + "px";
            target.style.top = top + "px";
        }

        function startGame() {
            clearInterval(timer);
            clearInterval(moveTimer);

            score = 0;
            timeLeft = 30;
            gameRunning = true;

            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            message.textContent = "Nhanh tay click vào hình tròn!";
            startBtn.disabled = true;

            target.style.display = "block";
            moveTarget();

            moveTimer = setInterval(function () {
                if (gameRunning) {
                    moveTarget();
                }
            }, 1000);

            timer = setInterval(function () {
                timeLeft--;
                timeDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        target.addEventListener("click", function (event) {
            if (!gameRunning) return;

            event.stopPropagation();

            score++;
            scoreDisplay.textContent = score;

            moveTarget();
        });

        function endGame() {
            gameRunning = false;

            clearInterval(timer);
            clearInterval(moveTimer);

            target.style.display = "none";
            startBtn.disabled = false;

            message.textContent =
                "Trò chơi kết thúc! Bạn đạt được " + score + " điểm.";
        }

        startBtn.addEventListener("click", startGame);
    </script>

</body>
</html>
